<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><title>订单详情</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="../../../assets/app-frame.css"><link rel="stylesheet" href="../../../assets/app-order-v11.css">
<style>*{box-sizing:border-box}body{margin:0;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));background:#F2F3F5;color:#1D2129;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.statusbar{height:44px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:#165DFF;color:#fff;font-size:12px}.statusbar b{font-size:14px}.nav{height:48px;padding:0 12px;display:grid;grid-template-columns:70px 1fr 70px;align-items:center;background:#fff;border-bottom:1px solid #E5E6EB}.nav button{min-height:44px;border:0;background:none;color:#165DFF;font:14px inherit;text-align:left}.nav h1{margin:0;text-align:center;font-size:16px}.note{margin:12px 16px 0;padding:9px 11px;border:1px solid #BEDAFF;border-radius:8px;background:#E8F3FF;color:#165DFF;font-size:11px;line-height:1.5}.card{margin:12px 16px;padding:15px 14px;border:1px solid #E5E6EB;border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(29,33,41,.04)}.card h2{margin:0 0 8px;font-size:15px}.row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid #F2F3F5;font-size:13px;line-height:1.45}.row:last-child{border-bottom:0}.row span:first-child{color:#86909C}.row strong{font-weight:500;text-align:right;overflow-wrap:anywhere}.footer{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid #E5E6EB}.footer button{width:100%;min-height:46px;border:0;border-radius:9px;background:#165DFF;color:#fff;font:600 15px inherit}.footer button:disabled{background:#C9CDD4}.missing{padding:60px 20px;text-align:center;color:#86909C}</style></head><body>
<div class="statusbar"><b>9:41</b><span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i> <i class="fa-solid fa-battery-full"></i></span></div><header class="nav"><button id="backBtn" type="button"><i class="fa-solid fa-chevron-left"></i> 返回</button><h1>订单详情</h1><span></span></header>
<p class="note">原型模拟：详情、权限及指派结果保存在本机浏览器；正式环境须接入后台鉴权与派单接口。</p><main id="content"></main><footer id="footer" class="footer"><button id="assignBtn" type="button">指派检测人</button></footer>
<div id="assignMask" class="order-mask"><div class="order-sheet"><h3>指派检测人</h3><p id="assignHint">请选择当前权限范围内的检测人。合法指派仅生成一条关联任务。</p><button class="order-person" data-person="李明">李明 · 检测一组</button><button class="order-person" data-person="王强">王强 · 检测二组</button><div class="order-sheet-actions"><button id="assignCancel" class="order-sheet-cancel">取消</button><button id="assignConfirm" class="order-sheet-confirm">确认指派</button></div></div></div><div id="toast" class="order-toast"></div>
<script src="../../../assets/app-order-v11.js"></script><script>
(function(){var p=OrderV11.getPermissions(),id=new URLSearchParams(location.search).get('id')||'',order=OrderV11.getOrder(id),selected='';function text(v){return v||'—'}function row(label,value){return '<div class="row"><span>'+label+'</span><strong>'+text(value)+'</strong></div>'}function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('is-on');setTimeout(function(){t.classList.remove('is-on')},2300)}function render(){if(!p.canViewOrders){document.getElementById('content').innerHTML='<div class="missing">当前角色没有订单查看权限。</div>';document.getElementById('footer').hidden=true;return}if(!order){document.getElementById('content').innerHTML='<div class="missing">未找到订单，请返回列表重试。</div>';document.getElementById('footer').hidden=true;return}var s=OrderV11.statusMeta(order);document.getElementById('content').innerHTML='<section class="card"><h2>'+text(order.orderName)+'</h2>'+row('订单编号',order.orderCode)+row('订单状态','<span class="order-status '+s.cls+'">'+s.text+'</span>')+row('创建时间',order.createdAt)+row('派单日期',order.dispatchDate)+row('截止日期',order.deadlineDate)+row('检测人员',order.assignedTo)+'</section><section class="card"><h2>工程关联</h2>'+row('所属工程',order.projectName)+row('对下合同',order.contractCode?(order.contractCode+' · '+order.contractName):'—')+row('客户简称',order.customerShort)+'</section><section class="card"><h2>站点信息</h2>'+row('区域',text(order.province)+' / '+text(order.city))+row('站点名称',order.stationName)+row('站址编码',order.siteCode)+row('经度',order.longitude)+row('纬度',order.latitude)+'</section><section class="card"><h2>检测要求</h2>'+row('检测类型',order.inspectionType)+row('检测规范组',order.standardGroup)+row('需求说明',order.requirements)+'</section>';var b=document.getElementById('assignBtn');if(order.status==='assigned'){b.textContent='已指派：'+order.assignedTo;b.disabled=true}else if(!p.canAssignOrder){b.textContent='无指派权限';b.disabled=true}else if(order.draft||!order.approved||order.status!=='pending'){b.textContent='未达到派单条件';b.disabled=true}else{b.textContent='指派检测人';b.disabled=false}}
document.getElementById('backBtn').onclick=function(){location.href='../工作台/首页/app_workbench_index.html#orders'};document.getElementById('assignBtn').onclick=function(){document.getElementById('assignMask').classList.add('is-on')};document.querySelectorAll('.order-person').forEach(function(b){b.onclick=function(){selected=b.dataset.person;document.querySelectorAll('.order-person').forEach(function(x){x.classList.toggle('is-selected',x===b)})}});document.getElementById('assignCancel').onclick=function(){document.getElementById('assignMask').classList.remove('is-on')};document.getElementById('assignMask').onclick=function(e){if(e.target===this)this.classList.remove('is-on')};document.getElementById('assignConfirm').onclick=function(){if(!selected){toast('请先选择检测人');return}var result=OrderV11.assign(order.orderId,selected);toast(result.message||'指派成功，已生成关联任务。');if(result.ok){order=result.order;document.getElementById('assignMask').classList.remove('is-on');render()}};render()})();
</script></body></html>
