<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>问题汇总详情</title>
<script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="../../../../assets/pc-layout.css">
<style>.pd-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.pd-summary{display:flex;gap:38px;align-items:center;border:1px solid var(--border);border-radius:6px;padding:16px 20px;margin-bottom:16px;font-size:14px}.pd-count{font-size:22px;color:var(--primary);font-weight:700}.pd-conditions{display:flex;gap:48px;flex-wrap:wrap;margin:16px 4px;color:var(--text-2);font-size:13px}.pd-lines{white-space:normal;line-height:1.8;text-align:left;min-width:270px}.pd-code{white-space:nowrap}.pd-note{margin-top:14px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:10px 14px;color:#1d4ed8;font-size:13px}.pd-table-wrap{overflow:auto}.pd-table-wrap .data-table{min-width:1480px}</style></head>
<body><div id="page-content"><div class="card"><div class="card-body">
<div class="pd-top"><div><button class="btn btn-text" id="back"><i class="fa-solid fa-arrow-left"></i> 返回</button> <strong style="font-size:16px">问题汇总详情</strong></div><button class="btn btn-primary" id="export"><i class="fa-solid fa-download"></i> 导出明细</button></div>
<div class="pd-summary"><span>区域：<strong id="region"></strong></span><span>问题报告：<span class="pd-count" id="count">0</span> 份</span></div>
<div class="pd-conditions"><span>检测任务创建时间：<strong id="taskRange"></strong></span><span>报告审批通过时间：<strong id="approvalRange"></strong></span></div>
<div class="pd-table-wrap"><table class="data-table"><thead><tr><th style="width:60px">序号</th><th style="width:150px">区域</th><th style="width:150px">站名</th><th style="width:180px">站址编码</th><th style="width:110px">经度</th><th style="width:110px">纬度</th><th style="width:150px">报告编号</th><th>问题描述汇总</th><th>整改意见汇总</th><th style="width:90px">检测情况</th></tr></thead><tbody id="detailBody"></tbody></table></div>
<div class="pd-note"><i class="fa-solid fa-circle-info"></i> 检测情况字段暂时保留，取值规则待确认，当前统一显示“—”。统计数量、详情和导出采用同一过滤口径。</div>
<div class="pagination"><span id="total">共 0 条记录</span><div class="pagination-btns"><button class="page-btn" id="prev"><i class="fa-solid fa-chevron-left"></i></button><button class="page-btn active" id="page">1</button><button class="page-btn" id="next"><i class="fa-solid fa-chevron-right"></i></button></div></div>
</div></div></div>
<script src="../../../../assets/rectification-data.js"></script><script src="../../../../assets/shared-layout.js"></script><script>window.__layoutConfig={active:'problem_summary',breadcrumb:['统计分析','问题汇总','问题汇总详情']};</script>
<script>(function(){var S=RectificationStore,p=new URLSearchParams(location.search),f={province:p.get('province')||'',city:p.get('city')||'',taskStart:p.get('taskStart')||'',taskEnd:p.get('taskEnd')||'',approvalStart:p.get('approvalStart')||'',approvalEnd:p.get('approvalEnd')||''},rows=[],page=1,pageSize=20;function el(id){return document.getElementById(id);}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function range(a,b){return !a&&!b?'不限':(a||'不限')+' 至 '+(b||'不限');}function numbered(list,field){return list.map(function(x,i){return '('+(i+1)+') '+(x[field]||'—');}).join('\n');}function render(){var max=Math.max(1,Math.ceil(rows.length/pageSize));if(page>max)page=max;var start=(page-1)*pageSize;el('detailBody').innerHTML=rows.slice(start,start+pageSize).map(function(r,i){var items=S.mergeProblemRows(r);return '<tr><td>'+(start+i+1)+'</td><td>'+esc(r.province+' / '+r.city)+'</td><td>'+esc(r.siteName||r.towerName)+'</td><td class="pd-code">'+esc(r.siteCode)+'</td><td>'+esc(r.longitude)+'</td><td>'+esc(r.latitude)+'</td><td>'+esc(r.reportNo)+'</td><td class="pd-lines">'+esc(numbered(items,'description')).replace(/\n/g,'<br>')+'</td><td class="pd-lines">'+esc(numbered(items,'opinion')).replace(/\n/g,'<br>')+'</td><td>—</td></tr>';}).join('')||'<tr><td colspan="10" style="padding:42px;color:var(--text-3)">当前条件下暂无符合统计口径的问题报告</td></tr>';el('count').textContent=rows.length;el('total').textContent='共 '+rows.length+' 条记录';el('page').textContent=page;el('prev').disabled=page<=1;el('next').disabled=page>=max;}document.addEventListener('DOMContentLoaded',function(){S.ensureDemoReports();rows=S.filterSummaryReports(f);el('region').textContent=(f.province||'全部省份')+' / '+(f.city||'全部城市');el('taskRange').textContent=range(f.taskStart,f.taskEnd);el('approvalRange').textContent=range(f.approvalStart,f.approvalEnd);el('back').onclick=function(){location.href='pc_problem_summary.html';};el('export').onclick=function(){if(!rows.length)return alert('暂无数据');S.downloadCsv('问题汇总明细_'+(f.province||'全部')+'_'+(f.city||'全部')+'.csv',['序号','区域','站名','站址编码','经度','纬度','报告编号','问题描述汇总','整改意见汇总','检测情况'],rows.map(function(r,i){var items=S.mergeProblemRows(r);return[i+1,r.province+' / '+r.city,r.siteName||r.towerName,"'"+r.siteCode,r.longitude,r.latitude,r.reportNo,numbered(items,'description'),numbered(items,'opinion'),'—'];}));alert('已导出当前区域和继承时间条件下的全部 '+rows.length+' 条明细');};el('prev').onclick=function(){page--;render();};el('next').onclick=function(){page++;render();};render();});})();</script></body></html>
